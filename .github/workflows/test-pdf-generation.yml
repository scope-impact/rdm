name: Test PDF Generation

on:
  push:
    branches: [main]
    paths:
      - 'rdm/init_files/**'
      - 'rdm/**/*.py'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'action.yml'
      - '.github/workflows/test-pdf-generation.yml'
  pull_request:
    paths:
      - 'rdm/init_files/**'
      - 'rdm/**/*.py'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'action.yml'
      - '.github/workflows/test-pdf-generation.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Install rdm CLI
        run: uv tool install .

      - name: Scaffold test project
        run: |
          rdm init -o test-dhf
          ls -la test-dhf/

      - name: Build wheel for Docker
        run: uv build --wheel --out-dir test-dhf/dist

      - name: Build the RDM image
        run: docker build -t rdm:test test-dhf

      # DI-70: a diagram is drawn by Mermaid's official image, beside the RDM
      # image, exactly as the PDF action draws it.
      - name: Add a document with a Mermaid diagram
        run: |
          cat > test-dhf/documents/system_context.md <<'MD'
          ---
          id: SC-001
          title: System context
          ---

          # System context

          ```mermaid
          C4Context
            Person(author, "Regulatory author", "Writes the record")
            System(rdm, "RDM", "Keeps the design record")
            Rel(author, rdm, "renders documents with")
          ```
          MD

      - name: Generate PDFs
        env:
          RDM_IMAGE: rdm:test
        run: bash rdm/init_files/render-pdfs.sh test-dhf pdfs

      - name: The diagram is an image in the PDF, not its source
        run: |
          sudo apt-get install -y --no-install-recommends poppler-utils > /dev/null
          text="$(pdftotext test-dhf/release/system_context.pdf -)"
          grep -q "Regulatory author" <<< "$text"
          if grep -q "C4Context" <<< "$text"; then echo "ERROR: the diagram's source is in the PDF"; exit 1; fi
          ls test-dhf/tmp/mermaid/*.svg

      - name: Verify PDFs were created
        run: |
          echo "Generated files:"
          find test-dhf/release -type f -name "*.pdf" | head -20

          # Fail if no PDFs were generated
          PDF_COUNT=$(find test-dhf/release -type f -name "*.pdf" | wc -l)
          echo "Total PDFs generated: $PDF_COUNT"

          if [ "$PDF_COUNT" -eq 0 ]; then
            echo "ERROR: No PDFs were generated!"
            exit 1
          fi

      - name: Upload PDFs as artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-pdfs
          path: test-dhf/release/*.pdf
          retention-days: 7
