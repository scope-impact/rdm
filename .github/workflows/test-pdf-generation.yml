name: Test PDF Generation

on:
  push:
    branches: [main]
    paths:
      - 'rdm/init_files/**'
      - 'rdm/**/*.py'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'action.yml'
      - '.github/workflows/test-pdf-generation.yml'
  pull_request:
    paths:
      - 'rdm/init_files/**'
      - 'rdm/**/*.py'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'action.yml'
      - '.github/workflows/test-pdf-generation.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Install rdm CLI
        run: uv tool install .

      - name: Scaffold test project
        run: |
          rdm init -o test-dhf
          ls -la test-dhf/

      - name: Build wheel for Docker
        run: uv build --wheel --out-dir test-dhf/dist

      - name: Generate PDFs
        run: |
          cd test-dhf
          docker compose run --rm rdm make pdfs

      - name: Verify PDFs were created
        run: |
          echo "Generated files:"
          find test-dhf/release -type f -name "*.pdf" | head -20

          # Fail if no PDFs were generated
          PDF_COUNT=$(find test-dhf/release -type f -name "*.pdf" | wc -l)
          echo "Total PDFs generated: $PDF_COUNT"

          if [ "$PDF_COUNT" -eq 0 ]; then
            echo "ERROR: No PDFs were generated!"
            exit 1
          fi

      - name: Upload PDFs as artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-pdfs
          path: test-dhf/release/*.pdf
          retention-days: 7
