name: Test

on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # the graph tests read history
          persist-credentials: false
          submodules: true # loyly (spec-v2): the adapter is checked against Löyly's own spec
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      # The latest stable CPython, whichever that is on the day.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        id: python
        with:
          python-version: '3.x'
      - name: Install dependencies
        env:
          PYTHON: ${{ steps.python.outputs.python-path }}
        run: uv sync --all-extras --python "$PYTHON"
      - name: Lint
        run: uv run ruff check .
      - name: Tests
        run: uv run pytest tests --alluredir allure-results
      # CSV-001 rendered with this run's results: the copy of RDM's tool
      # validation that users keep with their evaluations. Written when tests
      # fail too, so a failure shows in the record.
      - name: RDM's tool validation (CSV-001), with this run's verification
        if: ${{ !cancelled() }}
        run: |
          mkdir -p tool-validation dhf/data
          uv run rdm story verify --dhf dhf --allure-results allure-results -o dhf/data/verification.yml
          uv run rdm render dhf/documents/tool_validation.md dhf/config.yml dhf/data/verification.yml \
            > tool-validation/rdm-tool-validation.md
      - name: Upload the tool validation
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tool-validation-rdm
          path: tool-validation/rdm-tool-validation.md

  # Löyly's pi harness, audited from outside (examples/loyly-pi-harness): its
  # six clojure.test suites run unchanged, a bridge writes Allure, and RDM's
  # gates hold the harness to its own spec (the loyly submodule, spec-v2).
  loyly-pi-harness:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # the graph reads the history
          persist-credentials: false
          submodules: true
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Install RDM
        run: uv sync --all-extras
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'   # the JDK of Löyly's builder image
      # The Clojure CLI and babashka at the versions Löyly's builder image pins,
      # each download checked against its published SHA-256.
      - name: Install the Clojure CLI and babashka
        run: |
          mkdir -p "$RUNNER_TEMP/tools" && cd "$RUNNER_TEMP/tools"
          curl -fsSL -O https://github.com/clojure/brew-install/releases/download/1.12.6.1673/linux-install.sh
          bash linux-install.sh --prefix "$RUNNER_TEMP/clojure"
          bb=1.13.226; tgz="babashka-$bb-linux-amd64-static.tar.gz"
          curl -fsSL -O "https://github.com/babashka/babashka/releases/download/v$bb/$tgz"
          curl -fsSL -O "https://github.com/babashka/babashka/releases/download/v$bb/$tgz.sha256"
          echo "$(cat "$tgz.sha256")  $tgz" | sha256sum -c
          tar xzf "$tgz" -C "$RUNNER_TEMP/clojure/bin"
          echo "$RUNNER_TEMP/clojure/bin" >> "$GITHUB_PATH"
      - name: The harness's acceptance suites, through the bridge
        working-directory: examples/loyly-pi-harness
        run: ./run-acceptance.sh
      - name: RDM's gates over the harness
        working-directory: examples/loyly-pi-harness
        run: |
          uv run rdm story verify --dhf dhf --allure-results dhf/allure-results -o dhf/data/verification.yml
          uv run rdm story release-gate --dhf dhf --allure-results dhf/allure-results
          uv run rdm gap csv_tool_validation dhf/documents/tool_validation.md
          uv run rdm gap part11_document_control ../../dhf/documents/document_control.md   # Part 11: RDM's DC-001
          uv run rdm graph validate --dhf dhf --allure-results dhf/allure-results \
            --checklist csv_tool_validation
          uv run rdm story evidence-bundle --dhf dhf --allure-results dhf/allure-results -o release-evidence
          # CSV-HAR-001 rendered with this run's verification, for the evaluations users keep.
          uv run rdm render dhf/documents/tool_validation.md dhf/config.yml dhf/data/verification.yml \
            > release-evidence/loyly-pi-harness-tool-validation.md
      - name: The harness's release evidence (verification report PDF, matrix, results)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: loyly-pi-harness-evidence
          path: examples/loyly-pi-harness/release-evidence
