name: Test

on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # the graph tests read history
          persist-credentials: false
          submodules: true # loyly (spec-v2): the adapter is checked against Löyly's own spec
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      # The latest stable CPython, whichever that is on the day.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        id: python
        with:
          python-version: '3.x'
      - name: Install dependencies
        env:
          PYTHON: ${{ steps.python.outputs.python-path }}
        run: uv sync --all-extras --python "$PYTHON"
      - name: Lint
        run: uv run ruff check .
      - name: Tests
        run: uv run pytest tests

  # Löyly's pi harness, audited from outside (examples/loyly-pi-harness): its
  # six clojure.test suites run unchanged, a bridge writes Allure, and RDM's
  # gates hold the harness to its own spec (the loyly submodule, spec-v2).
  loyly-pi-harness:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # the graph reads the history
          persist-credentials: false
          submodules: true
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - name: Install RDM
        run: uv sync --all-extras
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'   # the JDK of Löyly's builder image
      # The Clojure CLI and babashka at the versions Löyly's builder image pins,
      # each download checked against its published SHA-256.
      - name: Install the Clojure CLI and babashka
        run: |
          mkdir -p "$RUNNER_TEMP/tools" && cd "$RUNNER_TEMP/tools"
          curl -fsSL -O https://github.com/clojure/brew-install/releases/download/1.12.6.1673/linux-install.sh
          bash linux-install.sh --prefix "$RUNNER_TEMP/clojure"
          bb=1.13.226; tgz="babashka-$bb-linux-amd64-static.tar.gz"
          curl -fsSL -O "https://github.com/babashka/babashka/releases/download/v$bb/$tgz"
          curl -fsSL -O "https://github.com/babashka/babashka/releases/download/v$bb/$tgz.sha256"
          echo "$(cat "$tgz.sha256")  $tgz" | sha256sum -c
          tar xzf "$tgz" -C "$RUNNER_TEMP/clojure/bin"
          echo "$RUNNER_TEMP/clojure/bin" >> "$GITHUB_PATH"
      - name: The harness's acceptance suites, through the bridge
        working-directory: examples/loyly-pi-harness
        run: ./run-acceptance.sh
      - name: RDM's gates over the harness
        working-directory: examples/loyly-pi-harness
        run: |
          uv run rdm story verify --dhf dhf --allure-results dhf/allure-results -o dhf/data/verification.yml
          uv run rdm story release-gate --dhf dhf --allure-results dhf/allure-results
          uv run rdm graph validate --dhf dhf --allure-results dhf/allure-results
          uv run rdm story evidence-bundle --dhf dhf --allure-results dhf/allure-results -o release-evidence
      - name: The harness's release evidence (verification report PDF, matrix, results)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: loyly-pi-harness-evidence
          path: examples/loyly-pi-harness/release-evidence
