name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "dhf/**"
      - "scripts/install-pdf-tools.sh"
      - "rdm/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "dhf/**"
      - "scripts/install-pdf-tools.sh"
      - "rdm/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # Always build (incl. PRs): a strict build is the link/nav check.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - name: Set up Python
        run: uv python install 3.12
      - name: Install all extras (the evidence hook runs the acceptance suite)
        run: uv sync --all-extras
      - name: Install Pandoc, Typst and the document fonts (the DHF pages' PDFs)
        run: |
          scripts/install-pdf-tools.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Build the docs site (strict; generates the traceability-matrix evidence page)
        run: uv run --extra docs mkdocs build --strict
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  # Deploy only from main.
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      pages: write          # deploy to GitHub Pages
      id-token: write       # verify the deployment originates from this workflow
    # One deployment at a time; never cancel one in progress.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
