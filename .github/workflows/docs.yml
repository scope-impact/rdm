name: Docs

# One RDM image, built the way an adopter builds it (rdm init, then docker
# compose), renders every PDF: the scaffolded project's, which checks the image
# and the template, and RDM's own design history file's, which the docs build
# takes as an artifact rather than rendering them again.

on:
  push:
    branches: [main]
    tags: ["v*"]          # a release publishes its own copy of the docs (DI-82)
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "dhf/**"
      - "rdm/**"
      - "pyproject.toml"
      - "uv.lock"
      - "action.yml"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "dhf/**"
      - "rdm/**"
      - "pyproject.toml"
      - "uv.lock"
      - "action.yml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  pdfs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # each PDF's revision and date are its document's last commit
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Scaffold a project, with this RDM's wheel for its image
        run: |
          uv tool install .
          rdm init -o test-dhf
          uv build --wheel --out-dir test-dhf/dist

      - name: Build the RDM image (the scaffold's docker compose)
        working-directory: test-dhf
        run: docker compose -p rdm-ci build

      - name: The scaffolded project's PDFs
        working-directory: test-dhf
        run: |
          docker compose -p rdm-ci run --rm rdm make pdfs
          count=$(find release -type f -name "*.pdf" | wc -l)
          echo "$count PDF(s)"; find release -type f -name "*.pdf"
          test "$count" -gt 0

      - name: RDM's design history file as PDFs, in the same image
        run: |
          docker run --rm -v "$PWD:/project" -w /project --entrypoint python rdm-ci-rdm \
            docs/_hooks/dhf.py dhf-pdfs

      - name: Upload the scaffolded project's PDFs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-pdfs
          path: test-dhf/release/*.pdf
          retention-days: 7

      - name: Upload the design history file's PDFs (the docs build links them)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dhf-pdfs
          path: dhf-pdfs
          if-no-files-found: error
          retention-days: 7

  # Always build (incl. PRs): a strict build is the link/nav check.
  build:
    needs: pdfs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # the tags name the release the docs are for (DI-80)
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Set up Python
        run: uv python install 3.12
      - name: Install all extras (the traceability hook runs both acceptance suites and the graph)
        run: uv sync --all-extras
      - name: The design history file's PDFs, from the pdfs job
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dhf-pdfs
          path: dhf-pdfs
      - name: Build the docs site (strict; draws RDM's and the example's traceability from their graphs)
        env:
          RDM_DHF_PDFS: dhf-pdfs
          RDM_DOCS_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}
        run: uv run --extra docs mkdocs build --strict

  # One copy of the docs per release tag, and the development version from main
  # (DI-82): mike keeps every published version on the gh-pages branch, and the
  # repository's Pages site serves that branch.
  deploy:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write       # mike pushes the built version to gh-pages
    # One deployment at a time; never cancel one in progress.
    concurrency:
      group: pages
      cancel-in-progress: false
    env:
      RDM_DHF_PDFS: dhf-pdfs
      RDM_DOCS_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Set up Python
        run: uv python install 3.12
      - name: Install all extras
        run: uv sync --all-extras
      - name: The design history file's PDFs, from the pdfs job
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dhf-pdfs
          path: dhf-pdfs
      - name: Publish this version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages --depth=1 || true   # absent before the first publish
          if [ "$RDM_DOCS_VERSION" = dev ]; then
            uv run --extra docs mike deploy --push dev
            # until the first release, the development version is the default
            uv run --extra docs mike list | grep -q latest || uv run --extra docs mike set-default --push dev
          else
            uv run --extra docs mike deploy --push --update-aliases "$RDM_DOCS_VERSION" latest
            uv run --extra docs mike set-default --push latest
          fi
