name: Design controls (dogfood)

# RDM eats its own dog food: RDM's own record goes through the same reusable
# workflow other repositories call (item-04-004), pinned to the commit under test.
# A PR that leaves a requirement unverified fails here; whether the tests mean
# something is judged by the PR's human review.
on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  design-controls:
    uses: ./.github/workflows/gates.yml
    with:
      rdm-ref: ${{ github.sha }}
      rdm-repository: ${{ github.repository }}
      # One install: the synced environment is RDM at this commit, so the
      # workflow does not install it a second time.
      install-rdm: false
      submodules: 'true'   # loyly: the adapter is checked against Löyly's own spec
      install-command: uv sync --all-extras && echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      test-command: uv run pytest tests/acceptance --clean-alluredir --alluredir=dhf/allure-results
      # RDM's record is held to Part 11 (DC-001) and validated as a tool (CSV-001).
      checklists: part11_document_control csv_tool_validation
