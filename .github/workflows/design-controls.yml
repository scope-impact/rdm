name: Design controls (dogfood)

# RDM eats its own dog food: RDM's own record goes through the same reusable
# workflow other repositories call (DI-63), pinned to the commit under test.
# A PR that leaves a design input unverified or breaks the design gate fails
# here; whether the tests mean something is judged by the PR's human review.
on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  design-controls:
    uses: ./.github/workflows/gates.yml
    with:
      rdm-ref: ${{ github.sha }}
      rdm-repository: ${{ github.repository }}
      # One install: the synced environment is RDM at this commit, so the
      # workflow does not install it a second time.
      install-rdm: false
      install-command: uv sync --all-extras && echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      # The unit tests run under coverage first: their code coverage per
      # component is unit-test evidence verify adds (DI-76), never acceptance
      # evidence, so it is measured apart from the acceptance run.
      test-command: >-
        uv run coverage run --source=rdm -m pytest tests --ignore=tests/acceptance -q &&
        uv run coverage xml -q -o dhf/data/unit-coverage.xml &&
        uv run pytest tests/acceptance --clean-alluredir --alluredir=dhf/allure-results
      unit-coverage: dhf/data/unit-coverage.xml
