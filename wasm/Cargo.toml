# rdm-spec's WebAssembly build (dhf/decisions/adr-0006-wasm-components.md;
# dhf/harness/stack.md, "The WebAssembly build"). One crate per component of
# the model, built for wasm32-wasip2 as a component on WASI 0.3; the native
# host; the stand-in for slices not built yet; the scenario driver.
[workspace]
resolver = "2"
members = [
    "host",
    "components/kernel-command",
    "components/kernel-command/kernel",
    "components/project-init",
    "components/project-adopt",
    "components/project-hooks",
    "not-built",
    "scenarios",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false

[workspace.dependencies]
wasip3 = { version = "=0.10.0", default-features = false }
wit-bindgen = { version = "=0.63.0", default-features = false, features = ["async", "macros"] }
dlmalloc = { version = "=0.2.14", features = ["global"] }
wasmtime = { version = "=49.0.4", features = ["component-model-async"] }
wasmtime-wasi = { version = "=49.0.4", default-features = false, features = ["p3"] }
tokio = { version = "=1.54.1", features = ["rt", "macros"] }
libc = "=0.2.191"
serde_json = "=1.0.154"
regex = "=1.13.1"
rdm-kernel = { path = "components/kernel-command/kernel" }
project-init = { path = "components/project-init" }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = "debuginfo"

[profile.release.package.rdm-spec-host]
opt-level = 3
