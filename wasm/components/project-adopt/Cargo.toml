# Component Adopt of the project context (dhf/spec/model.edn, :project/adopt),
# built to project-adopt-component (dhf/wit/project-adopt.wit).
[package]
name = "project-adopt"
version.workspace = true
edition.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rdm-kernel = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasip3 = { workspace = true, features = ["bitflags"] }
wit-bindgen = { workspace = true }
