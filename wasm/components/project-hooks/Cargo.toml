# Component Hooks of the project context (dhf/spec/model.edn, :project/hooks),
# built to project-hooks-component (dhf/wit/project-hooks.wit).
[package]
name = "project-hooks"
version.workspace = true
edition.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rdm-kernel = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasip3 = { workspace = true, features = ["bitflags"] }
wit-bindgen = { workspace = true }
