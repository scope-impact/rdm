md_extensions:
  #- 'rdm.md_extensions.SectionNumberExtension'
  - 'rdm.md_extensions.VocabularyExtension'
    #- 'rdm.md_extensions.AuditNoteExclusionExtension'

reviews_required: True

# The spec RDM holds the record to: requirements are Gherkin scenarios tagged
# with an id, user needs by default their Features. Leave it out when the spec
# is at spec/ or features/ (or a Löyly plan at .pi/plan) in the repository;
# otherwise name a directory, relative to this DHF:
# spec: ../spec
# or a mapping (globs, the id tag's pattern, the needs source):
# spec:
#   features: ["../spec/**/*.feature"]
#   exclude: ["**/drafts.feature"]
#   id: "REQ-\\d+"
#   needs: feature          # feature | allium (a Löyly spec's event model)
