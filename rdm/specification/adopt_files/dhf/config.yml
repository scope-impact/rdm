# Render configuration (rdm render <template> dhf/config.yml <data files…>).
# The Markdown extensions run over the rendered lines, in order:
#   rdm.md_extensions.SectionNumberExtension     numbers the headings
#   rdm.md_extensions.VocabularyExtension        a glossary of the words a document uses
#   rdm.md_extensions.AuditNoteExclusionExtension  removes [[…]] notes (the release copy)
md_extensions: []

# The spec RDM holds the record to. Leave it out when it is at .pi/plan (the
# Löyly way: rdm adopt lays a skeleton there when the repository has no spec
# yet), spec/ or features/ (plain Gherkin) in the repository; otherwise name
# its directory, relative to this DHF:
# spec: ../spec
# or a mapping (globs, the id tag's pattern, the needs source):
# spec:
#   features: ["../spec/**/*.feature"]
#   exclude: ["**/drafts.feature"]
#   id: "REQ-\\d+"
#   needs: feature          # feature | allium (a Löyly spec's event model)
