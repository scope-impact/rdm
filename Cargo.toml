[package]
name = "harness"
version = "0.0.0"
edition = "2021"
description = "A pluggable, opinionated harness that forces an event storm and regenerates a product by container and component"
license = "MIT"
publish = false

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.8"

[[bin]]
name = "harness"
path = "src/main.rs"
