name: Design controls

# Every pull request to the default branch, and every push to it, runs the
# design controls and the Part 11 gap analysis (DI-9). The ruleset requires the
# two checks this workflow reports, by these names:
#   design-controls / gates    RDM's reusable gates: design gate, acceptance
#                              tests, verify, release gate, graph validation
#   part11-gap-analysis        the SOP addresses every Part 11 checklist item
# Copy this file to .github/workflows/ in a real repository.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  design-controls:
    # RDM pinned to a released tag: the tool that verifies a change is itself a
    # controlled version. rdm-ref is the same tag as after the @.
    uses: scope-impact/rdm/.github/workflows/gates.yml@v1.2.0
    with:
      rdm-ref: v1.2.0

  part11-gap-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"
      - name: Install rdm
        run: pip install "rdm @ git+https://github.com/scope-impact/rdm@v1.2.0"   # not PyPI's rdm, another project
      - name: Part 11 gap analysis of the SOP
        run: rdm gap checklists/part11_document_control.txt documents/document_control_procedure.md
