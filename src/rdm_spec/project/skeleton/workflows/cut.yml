# Cuts every merge: on every push to the default branch, rdm-spec cut tags
# HEAD spec-N when it is origin/HEAD, and pushes the tag. Cutting twice
# changes nothing.
name: cut

on:
  push:

permissions:
  contents: write

jobs:
  cut:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # rdm-spec must be installed on the runner before this step.
      - name: Cut
        run: rdm-spec cut
