site_name: RDM
site_description: >-
  The design record of regulated software as Markdown and tests in git —
  gated, rendered into regulatory documents, and built into a read-only graph
  for people and agents.
site_url: https://scope-impact.github.io/rdm/
repo_url: https://github.com/scope-impact/rdm
repo_name: scope-impact/rdm
docs_dir: docs
# build/ and dist/ are gitignored; keep the rendered site there too.
site_dir: site

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - toc.follow
  palette:
    - scheme: default
      primary: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            show_root_heading: true
            show_source: true
            show_submodules: true
            members_order: source
            docstring_section_style: spacy
            separate_signature: true

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true

# Build-time evidence generation (docs/traceability-matrix.md) — see the hook.
hooks:
  - docs/_hooks/evidence.py

nav:
  - Home: index.md
  - The big picture:
      - How RDM works: record-first-architecture.md
      - The data model: data-model.md
      - Glossary: glossary.md
      - Plan vs. record: plan-vs-record.md
  - Get started:
      - Installation: installation.md
      - New project (rdm init): quickstart-new-project.md
      - Existing repository (rdm adopt): quickstart-existing-repo.md
  - Record:
      - Design inputs and tests: design-controls.md
      - Changing the record: agent-workflow.md
      - Risk register: risk.md
  - Gates:
      - The gates: gates.md
      - Gap analysis: gap-analysis.md
      - The gates in your CI: reusable-ci.md
      - Checklist format: checklist-format.md
      - Usability validation (formative): ai-persona-usability-validation.md
  - Graph:
      - The record as a graph: graph.md
      - Gate rules as SHACL: graph-shapes.md
      - Browsing in Graph Explorer: graph-explorer.md
      - For agents (MCP): agents.md
  - Documents:
      - Authoring and rendering: authoring.md
  - RDM on RDM:
      - How RDM controls itself: dogfood.md
      - Document control (Part 11): document-control.md
      - Traceability matrix (generated): traceability-matrix.md
  - Reference:
      - CLI: cli.md
      - API: reference.md
      - FAQ: FAQ.md
      - ADR 0001 — User needs across bounded contexts: adr-0001-bounded-context-user-needs.md
      - Change history: HISTORY.md
      - Research notes:
          - Health hazard taxonomies: research/health-hazard-taxonomies.md
          - ReqIF and StrictDoc typing: research/reqif-strictdoc-typing.md
