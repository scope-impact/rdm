site_name: RDM
site_description: >-
  The design record of regulated software as Markdown and tests in git —
  gated, rendered into regulatory documents, and built into a read-only graph
  for people and agents.
site_url: https://scope-impact.github.io/rdm/
repo_url: https://github.com/scope-impact/rdm
repo_name: scope-impact/rdm
docs_dir: docs
# build/ and dist/ are gitignored; keep the rendered site there too.
site_dir: site

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - toc.follow
  # One theme, its tokens in docs/stylesheets/rdm-theme.css (shared with the traceability map).
  palette:
    scheme: rdm
    primary: custom
    accent: custom
  font:
    text: Nunito Sans
    code: JetBrains Mono

extra_css:
  - stylesheets/rdm-theme.css

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            show_root_heading: true
            show_source: true
            show_submodules: true
            members_order: source
            docstring_section_style: spacy
            separate_signature: true

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true

# Build-time evidence generation (docs/traceability-matrix.md) — see the hook.
# The build hooks and their template are not pages.
exclude_docs: |
  _hooks/
  research/

hooks:
  - docs/_hooks/evidence.py
  - docs/_hooks/traceability_map.py
  - docs/_hooks/dhf.py

nav:
  - Home: index.md
  - Get started: get-started.md
  - How RDM works: record-first-architecture.md
  - Glossary: glossary.md
  - Plan vs. record: plan-vs-record.md
  - Record:
      - Design inputs and tests: design-controls.md
      - Changing the record: agent-workflow.md
      - Risk register: risk.md
      - Validation evidence: ai-persona-usability-validation.md
  - Gates:
      - The gates: gates.md
      - Gap analysis and checklists: gap-analysis.md
      - The gates in your CI: reusable-ci.md
  - Graph:
      - The record as a graph: graph.md
      - Browsing in Graph Explorer: graph-explorer.md
      - For agents (MCP): agents.md
  - Documents:
      - Authoring and rendering: authoring.md
  - RDM on RDM:
      - Overview: dhf/README.md
      - Changing RDM: dhf/AGENT_WORKFLOW.md
      - Traceability matrix (generated): traceability-matrix.md
      - Traceability map (generated): traceability-map.md
      - V&V plan and user needs: dhf/documents/verification_and_validation_plan.md
      - System architecture: dhf/documents/architecture.md
      - Software design:
              - Architecture: dhf/documents/design/architecture.md
              - Compliance: dhf/documents/design/compliance.md
              - Knowledge graph: dhf/documents/design/graph.md
              - Publishing: dhf/documents/design/publishing.md
              - Release: dhf/documents/design/release.md
              - Risk: dhf/documents/design/risk.md
              - Design specification: dhf/documents/design/specification.md
              - Test evidence: dhf/documents/design/test_evidence.md
      - Risk policy: dhf/documents/risk/policy.md
      - Risk register: dhf/documents/risk/tool_risks.md
      - Design review: dhf/documents/design_review.md
      - Document control: dhf/documents/document_control.md
      - "ADR 0001: user needs across bounded contexts": dhf/decisions/adr-0001-bounded-context-user-needs.md
  - Reference:
      - CLI: cli.md
      - API: reference.md
      - Changelog: changelog.md
