site_name: RDM
site_description: >-
  The design record of regulated software as Markdown and tests in git —
  gated, rendered into regulatory documents, and built into a read-only graph
  for people and agents.
site_url: https://scope-impact.github.io/rdm/
repo_url: https://github.com/scope-impact/rdm
repo_name: scope-impact/rdm
docs_dir: docs
# build/ and dist/ are gitignored; keep the rendered site there too.
site_dir: site

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.footer
    - navigation.top
    - content.code.copy
    - toc.follow
  # One theme, its tokens in docs/stylesheets/rdm-theme.css (shared with the traceability map).
  palette:
    scheme: rdm
    primary: custom
    accent: custom
  font:
    text: Nunito Sans
    code: JetBrains Mono

extra_css:
  - stylesheets/rdm-theme.css
  - stylesheets/traceability-map.css   # scoped to .rdm-map

# The traceability map's script: on every page, so its path resolves at any depth; it does
# nothing on a page without a map.
extra_javascript:
  - javascripts/traceability-map.js

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            show_root_heading: true
            show_source: true
            show_submodules: true
            members_order: source
            docstring_section_style: spacy
            separate_signature: true

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true

# Build hooks: traceability from the graph (RDM's and the example's), and RDM's DHF as pages.
# The build hooks and their template are not pages.
exclude_docs: |
  _hooks/
  research/

hooks:
  - docs/_hooks/traceability.py
  - docs/_hooks/dhf.py

nav:
  - Instructions for use:
      - Cover: index.md
      - 1. Intended use: about/intended-use.md
      - 2. How RDM works:
          - How RDM works: about/how-rdm-works.md
          - Plan vs. record: about/plan-vs-record.md
      - 3. Safety and limitations: about/safety.md
      - 4. Installation: install/installation.md
      - 5. Getting started: install/getting-started.md
      - 6. Operating instructions:
          - use/index.md
          - Changing the record: use/changing-the-record.md
          - Design inputs and tests: use/design-inputs-and-tests.md
          - Risk register: use/risk-register.md
          - Validation evidence: use/validation-evidence.md
          - The gates: use/gates.md
          - Gap analysis: use/gap-analysis.md
          - The gates in your CI: use/ci.md
          - The record as a graph: use/graph.md
          - Browsing in Graph Explorer: use/graph-explorer.md
          - For agents (MCP): use/agents.md
          - Authoring and rendering: use/documents.md
      - 7. Troubleshooting: troubleshooting.md
      - 8. Reference:
          - reference/index.md
          - CLI: reference/cli.md
          - API: reference/api.md
          - Glossary: reference/glossary.md
          - "Worked example: Part 11": reference/worked-example.md
      - 9. Revision history: revision-history.md
  - Design history (RDM on RDM):
      - Overview: dhf/README.md
      - Changing RDM: dhf/AGENT_WORKFLOW.md
      - Traceability (from the graph): traceability-map.md
      - V&V plan and user needs: dhf/documents/verification_and_validation_plan.md
      - System architecture: dhf/documents/architecture.md
      - Software design:
              - Architecture: dhf/documents/design/architecture.md
              - Compliance: dhf/documents/design/compliance.md
              - Knowledge graph: dhf/documents/design/graph.md
              - Publishing: dhf/documents/design/publishing.md
              - Release: dhf/documents/design/release.md
              - Risk: dhf/documents/design/risk.md
              - Design specification: dhf/documents/design/specification.md
              - Test evidence: dhf/documents/design/test_evidence.md
      - Risk policy: dhf/documents/risk/policy.md
      - Risk register: dhf/documents/risk/tool_risks.md
      - Design review: dhf/documents/design_review.md
      - Document control: dhf/documents/document_control.md
      - Instructions for use (IFU): dhf/documents/user_manual.md
      - "ADR 0001: user needs across bounded contexts": dhf/decisions/adr-0001-bounded-context-user-needs.md
