[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "rdm"
version = "2.0.0-alpha"
description = "The design record of regulated software as Markdown and tests in git: gated, rendered, and queryable as a graph"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Innolitics, LLC", email = "info@innolitics.com"}
]
keywords = ["regulatory", "documentation", "medical", "iec62304", "iec82304", "iso14971", "510k"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Healthcare Industry",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.10"
dependencies = [
    "jinja2==3.1.6",
    "pyyaml==6.0.3",
    "gitpython==3.2.0"
]

[project.optional-dependencies]
# Playwright for the usability-persona skill (AI-persona usability validation).
# Browsers are provided by the environment; if the preinstalled browser version
# differs, launch with executable_path.
validation = ["playwright==1.63.0"]
# The design record as a linked-data graph (DI-35/36): an embedded RDF store
# (pyoxigraph), which RDM also serves as a read-only SPARQL endpoint for
# graph browsers such as AWS Graph Explorer; pyshacl runs the gate shapes
# (DI-38); mcp serves it to agents, read-only (DI-41/42). Optional: the record core keeps
# no RDF dependency.
graph = ["pyoxigraph==0.5.11", "pyshacl==0.40.1", "mcp==2.2.0"]
# The verification report as PDF (DI-64): Typst compiled in-process, so CI
# needs no Pandoc. Without it, a `typst` executable on PATH is used.
report = ["typst==0.15.0"]
# Documentation site (Markdown prose under docs/ + an API reference generated
# from the source docstrings via mkdocstrings). Build with:
#   uv run --extra docs mkdocs build      # -> site/ (gitignored)
#   uv run --extra docs mkdocs serve      # live preview
docs = [
    "mkdocs==1.6.1",
    "mkdocs-material==9.7.7",
    "mkdocstrings[python]==1.0.6",
    "ruff==0.16.10",  # mkdocstrings uses it to format rendered signatures
]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.10",
    "check-manifest==0.51",
    "mkdocs==1.6.1",
    "mkdocs-material==9.7.7",
    "mkdocstrings[python]==1.0.6",
    "mock==5.2.0",
    "docutils==0.23",
    "coverage==7.16.2",
    "playwright==1.63.0",
    "allure-pytest==2.16.2",
    "pyoxigraph==0.5.11",
    "pyshacl==0.40.1",
    "mcp==2.2.0",
    "typst==0.15.0",
    "pypdf==6.19.0",  # the DI-64 test reads the rendered report back
]

[project.scripts]
rdm = "rdm.main:main"

[project.urls]
Homepage = "https://github.com/scope-impact/rdm"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["rdm*"]
exclude = ["contrib*", "docs*", "tests*"]

[tool.setuptools.package-data]
rdm = [
    "graph/*.ttl",
    "publishing/*.typ",
    "compliance/checklists/*",
    "specification/init_files/.gitignore",
    "specification/init_files/*",
    "specification/init_files/data/*",
    "specification/init_files/images/*",
    "specification/init_files/images/uimockups/*",
    "specification/init_files/documents/*",
    "specification/init_files/documents/510k/*",
    "specification/hook_files/*",
    "specification/adopt_files/.claude/*",
    "specification/adopt_files/.github/workflows/*",
    "specification/adopt_files/.githooks/*",
    "specification/adopt_files/dhf/*",
    "specification/adopt_files/dhf/documents/*",
    "specification/adopt_files/dhf/documents/design/*",
    "specification/adopt_files/scripts/*"
]

[tool.ruff]
line-length = 120
exclude = [".tox", "*.egg", "build", "data", ".venv"]

[tool.ruff.lint]
select = ["E", "W", "F"]

[tool.bdist_wheel]
universal = true

[tool.pytest.ini_options]
# The example is its own project, run from its own directory (CI does).
testpaths = ["tests"]
norecursedirs = [".venv", "build", "dist"]

