name: 'RDM PDF Generator'
description: >-
  Render a repository's regulatory documents to PDF with RDM, Pandoc and
  Typst, in the RDM image of the release this action is pinned to (DI-63).

inputs:
  dhf_path:
    description: 'Path to DHF directory'
    default: 'dhf'
  version:
    description: >-
      RDM image tag. Defaults to the release this action is pinned to
      (uses: scope-impact/rdm@v2.0.0-alpha renders with image 2.0.0-alpha), and to
      latest when it is pinned to a branch or a sha.
    default: ''
  artifact_name:
    description: 'Name for the uploaded artifact'
    default: 'regulatory-documents'

runs:
  using: 'composite'
  steps:
    - name: Generate PDFs
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        ACTION_REF: ${{ github.action_ref }}
        DHF: ${{ inputs.dhf_path }}
      run: |
        if [ -z "$VERSION" ]; then
          if [[ "$ACTION_REF" =~ ^v[0-9] ]]; then VERSION="${ACTION_REF#v}"; else VERSION=latest; fi
        fi
        echo "RDM image: ghcr.io/scope-impact/rdm:$VERSION"
        docker run --rm \
          -v "$GITHUB_WORKSPACE:/project" \
          -w "/project/$DHF" \
          --entrypoint make \
          "ghcr.io/scope-impact/rdm:$VERSION" \
          pdfs

    - name: Upload PDFs
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ inputs.artifact_name }}
        path: ${{ inputs.dhf_path }}/release/**/*.pdf
